[project]
name = "textsplitters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prthm45-kanha", email = "agrawalpratham2706@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
textsplitters = "textsplitters:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
